name: "🚀 Feature Request"
description: Suggest an improvement for ElegooSlicer
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to ElegooSlicer.

        Please describe the user problem and desired outcome rather than only a specific implementation. For early-stage ideas or general discussion, visit [GitHub Discussions](https://github.com/ELEGOO-3D/ElegooSlicer/discussions) or the [ELEGOO Discord community](https://discord.com/invite/NkFzP96cMt).

  - type: checkboxes
    id: existing_request
    attributes:
      label: Is there an existing request for this feature?
      description: Search open and closed issues for the same or a similar request.
      options:
        - label: I have searched the existing issues and discussions
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: Explain the workflow problem, limitation, or user need this feature would address.
      placeholder: When I ..., I cannot ..., which means ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Slicing or toolpath generation
        - Printer or filament profiles
        - Printer connection and device control
        - User interface and workflow
        - File import or export
        - Calibration
        - Other
    validations:
      required: true

  - type: dropdown
    id: printer_scope
    attributes:
      label: Printer scope
      description: Select all printer groups that would benefit.
      multiple: true
      options:
        - ELEGOO printers
        - Other Klipper-based printers
        - Other Marlin-based printers
        - All supported printers
        - Not printer-specific
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or workflow you would like ElegooSlicer to provide.
      placeholder: ElegooSlicer should ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or alternative solutions you have tried.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, example files, links, or other context that clarifies the request.

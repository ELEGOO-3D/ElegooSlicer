name: "🐛 Bug Report"
description: Report a reproducible problem in ElegooSlicer
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ElegooSlicer.

        This form is for reproducible software defects. For feature ideas, use the [feature request form](https://github.com/ELEGOO-3D/ElegooSlicer/issues/new?template=feature_request.yml). For usage questions and troubleshooting, please visit the [ELEGOO Discord community](https://discord.com/invite/NkFzP96cMt).

        Before filing, search both open and closed issues. If the problem has already been reported, add your details to the existing issue instead.

  - type: checkboxes
    id: latest_version
    attributes:
      label: Is the issue reproducible in the latest ElegooSlicer release?
      description: Please verify the issue with the [latest release](https://github.com/ELEGOO-3D/ElegooSlicer/releases/latest), as it may already be fixed.
      options:
        - label: I have tested the latest release and the issue is still reproducible
          required: true

  - type: checkboxes
    id: existing_issue
    attributes:
      label: Is there an existing issue for this problem?
      options:
        - label: I have searched the existing open and closed issues
          required: true

  - type: input
    id: version
    attributes:
      label: ElegooSlicer version
      description: Enter the full version shown under `Help` -> `About ElegooSlicer`.
      placeholder: e.g. 1.3.0
    validations:
      required: true

  - type: dropdown
    id: os_type
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Operating system version
      placeholder: e.g. Windows 11 23H2, macOS 15.1, Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: Additional system information
      description: For performance or rendering issues, include CPU, memory, and graphics card or GPU driver details.
      placeholder: |
        CPU: AMD Ryzen 7 7800X3D
        Memory: 32 GB
        GPU and driver: NVIDIA RTX 4070, driver 560.94

  - type: input
    id: printer
    attributes:
      label: Printer model
      description: Enter the printer profile selected when the issue occurred.
      placeholder: e.g. ELEGOO Centauri Carbon, Neptune 4 Pro
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Printer firmware
      description: If the issue involves printing or device communication, enter the firmware version.
      placeholder: e.g. V1.2.3

  - type: textarea
    id: reproduce_steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps that triggers the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Slice the plate
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: actual_results
    attributes:
      label: Actual result
      description: Describe what happened. Attach a screenshot or recording when it helps explain the problem.
    validations:
      required: true

  - type: textarea
    id: expected_results
    attributes:
      label: Expected result
      description: Describe what you expected to happen instead.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Diagnostic files

        Please attach a ZIP archive containing the relevant files. Remove confidential model data or account information before uploading.

        - **Project file (`.3mf`)**: use `File` -> `Save Project As...` immediately before or after reproducing the issue. The project contains the model arrangement and slicing settings needed for diagnosis.
        - **Logs**: use `Help` -> `Show Configuration Folder`, open the `log` directory, and ZIP the newest logs covering the time of the issue.

  - type: textarea
    id: file_uploads
    attributes:
      label: Project file and logs
      description: Drag the ZIP archive(s) into this field. If you cannot share a file, explain why.
      placeholder: Attach project and log ZIP files here, or explain why they cannot be provided.
    validations:
      required: true

  - type: checkboxes
    id: file_checklist
    attributes:
      label: Files included
      options:
        - label: Project file (`.3mf`), when the issue depends on a model or slicing settings
        - label: Application logs, when the issue is a crash, startup failure, or device/network problem

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots, recordings, related links, workarounds, or any other useful context.
